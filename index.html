<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real1SAT</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://jsdelivr.net" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 20px;
        }
        .my-custom-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: inline-block;
        }
    </style>
</head>
<body class="bg-light">

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                
                <!-- Main Card Layout -->
                <div class="my-custom-container p-5 border w-100 text-center">
                    <h1 class="display-5 fw-bold text-dark">Real1SAT</h1>
                    <p class="lead text-muted my-3">All is Free & Free is all</p>
                    
                    <hr class="my-4">

                    <!-- INTERACTIVE ELEMENT 1: Dropdown Menu -->
                    <div class="dropdown my-3">
                        <button class="btn btn-secondary dropdown-toggle w-100" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Select an Option
                        </button>
                        <ul class="dropdown-menu w-100 text-center">
                            <li><a class="dropdown-menu-item dropdown-item" href="#">Free Tools</a></li>
                            <li><a class="dropdown-menu-item dropdown-item" href="#">Documentation</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-menu-item dropdown-item text-danger" href="#">Premium Features (Soon)</a></li>
                        </ul>
                    </div>

                    <!-- INTERACTIVE ELEMENT 2: Popup Modal Button -->
                    <button type="button" class="btn btn-primary btn-lg w-100 my-2 shadow-sm" data-bs-toggle="modal" data-bs-target="#infoModal">
                        Open Live Dashboard
                    </button>

                    <!-- INTERACTIVE ELEMENT 3: Toggleable Alert Panel -->
                    <div class="alert alert-warning alert-dismissible fade show mt-4 text-start" role="alert">
                        <strong>Quick Tip:</strong> You can close this notification block by clicking the 'X' on the right side!
                        <button type="button" class="btn-close" data-bs-with-dismiss="alert" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <!-- MODAL POPUP WINDOW (Hidden by default until button is clicked) -->
    <div class="modal fade" id="infoModal" tabindex="-1" aria-labelledby="infoModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-start">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="infoModalLabel">Real1SAT System Status</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    
                    <div class="progress" role="progressbar" aria-label="Success example" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
                        <div class="progress-bar bg-success" style="width: 100%">All Systems Free (100%)</div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn2 btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JavaScript Bundle with Popper (Required for interactive components) -->
    <script src="https://jsdelivr.net" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
